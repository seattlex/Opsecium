<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';">
  <title>Opsecium</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="mark"></div>
  <h1 id="heading">Locked</h1>
  <p class="hint" id="hint">Enter the passphrase to carry on.</p>

  <form id="form">
    <input type="password" id="passphrase" autocomplete="off" spellcheck="false"
           placeholder="Passphrase" autofocus>
    <button type="submit" id="submit">Unlock</button>
  </form>

  <p class="error" id="error"></p>
  <p class="foot" id="foot"></p>

  <script src="lock.js"></script>
</body>
</html>
