name: release

# Tag a version and the installers build themselves:
#   npm version 0.2.0 && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis portable
          - os: macos-latest
            name: macos
            args: --mac dmg zip
          - os: ubuntu-latest
            name: linux
            args: --linux AppImage deb tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Each installer is built on its own platform. Cross building windows
      # from linux needs wine and produces an exe with no icon or version
      # information, which is not what anyone should be downloading.
      - name: build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # there is no certificate here, so do not go looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: opsecium-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
