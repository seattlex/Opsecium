name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner ships the SUID helper unconfigured, and chromium would
      # rather abort than start without a sandbox. Fixing the mode keeps the
      # sandbox on, which is better than testing with --no-sandbox.
      - name: let chromium use its sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: unit tests
        run: npm test

      - name: identity lands on the wire and in the page
        run: xvfb-run -a npm run smoke

      - name: nothing readable is left on the disk
        run: xvfb-run -a npm run smoke:disk
