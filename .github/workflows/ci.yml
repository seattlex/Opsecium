name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: unit tests
        run: npm test

      - name: identity lands on the wire and in the page
        run: xvfb-run -a npm run smoke

      - name: nothing readable is left on the disk
        run: xvfb-run -a npm run smoke:disk
